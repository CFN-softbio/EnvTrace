[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envtrace"
version = "0.0.1"
description = "EnvTrace: behavioral evaluation of code through execution trace alignment."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "EnvTrace Contributors" }]
keywords = ["evaluation", "digital twin", "trace alignment", "LLM", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
urls = { "Homepage" = "https://github.com/CFN-softbio/EnvTrace", "Repository" = "https://github.com/CFN-softbio/EnvTrace" }
dependencies = [
    "numpy>=1.21",
]
 
[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.0.0",
    "pytest>=7.0.0",
]

# This file sits inside the package folder itself (there is no inner envtrace/ folder),
# so the package is mapped onto "." explicitly. The license is given by the SPDX
# expression above; PEP 639 forbids a license classifier next to it.
[tool.setuptools]
package-dir = { "envtrace" = "." }
packages = ["envtrace", "envtrace.core", "envtrace.io"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[project.scripts]
envtrace = "envtrace.cli:main"
